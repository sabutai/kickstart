<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экран упражнения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
.statRow>div+div{border-left:1px solid rgba(255,255,255,0.1)}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{ink}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <div style="position:relative;height:468px;flex:0 0 auto;background:{{heroGlow}};overflow:hidden">

    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:10px">
      <svg viewBox="0 0 100 120" width="236" height="283" fill="none">
        <path d="M48 28 L51 58 M51 34 L30 24 M51 34 L70 42 M51 58 L47 96 L43 104 M51 58 L68 70 L74 54" stroke="#000000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M48 28 L51 58 M51 34 L30 24 M51 34 L70 42 M51 58 L47 96 L43 104 M51 58 L68 70 L74 54" stroke="{{mannequinYellow}}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="48" cy="18" r="12" fill="{{mannequinYellow}}" stroke="#000000" stroke-width="4.5"></circle>
      </svg>
    </div>

    <div style="position:absolute;top:0;left:0;right:0;height:100%;background:linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 58%, {{ink}} 100%)"></div>

    <div style="position:absolute;top:22px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between">
      <a href="Library.dc.html" aria-label="{{back}}" style="width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 6L8 12L15 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <div style="font-size:10.5px;font-weight:800;color:#FFFFFF;background:rgba(255,255,255,0.14);border-radius:999px;padding:7px 14px;text-transform:uppercase;letter-spacing:0.4px">{{category}}</div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:30px;display:flex;align-items:center;justify-content:space-between;padding:0 20px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:52px;height:52px;border-radius:999px;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="{{ink}}"><path d="M8 5V19L19 12Z"></path></svg>
        </div>
        <div style="background:rgba(0,0,0,0.45);color:#FFFFFF;font-size:11px;font-weight:800;border-radius:999px;padding:6px 12px">0:18 · {{demoLabel}}</div>
      </div>
      <div style="position:absolute;right:20px;bottom:30px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.45);border-radius:999px;padding:6px 10px" aria-label="{{captionsLabel}}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#FFFFFF" stroke-width="1.8"></rect><path d="M8 13.5C7 13.5 6.5 12.8 6.5 12S7 10.5 8 10.5C8.6 10.5 9 10.8 9.3 11.2M14.5 13.5C13.5 13.5 13 12.8 13 12S13.5 10.5 14.5 10.5C15.1 10.5 15.5 10.8 15.8 11.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <span style="font-size:9.5px;font-weight:800;color:#FFFFFF">CC</span>
      </div>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:11px;padding:16px 20px 10px 20px;overflow:hidden;background:{{ink}}">

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="font-family:{{displayFont}};font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px">{{title}}</div>
      <div style="display:flex;align-items:center;gap:9px">
        <div style="display:flex;gap:3px">
          <sc-for list="{{pips}}" as="p" hint-placeholder-count="5">
            <span style="width:13px;height:5px;border-radius:2px;background:{{p.color}}"></span>
          </sc-for>
        </div>
        <span style="font-size:10.5px;font-weight:700;color:{{gray}};text-transform:uppercase">{{levelLabel}}</span>
        <span style="width:3px;height:3px;border-radius:999px;background:{{gray}}"></span>
        <span style="font-size:10.5px;font-weight:700;color:{{gray}};text-transform:uppercase">{{tag1}} · {{tag2}}</span>
      </div>
    </div>

    <div class="statRow" style="display:flex;padding:12px 0;border-top:1px solid {{line}};border-bottom:1px solid {{line}}">
      <div style="flex:1;text-align:center">
        <div style="font-family:{{displayFont}};font-size:15px;font-weight:700">{{sets}}</div>
        <div style="font-size:8.5px;color:{{gray}};font-weight:700;margin-top:3px;text-transform:uppercase">{{setsLabel}}</div>
      </div>
      <div style="flex:1;text-align:center">
        <div style="font-family:{{displayFont}};font-size:15px;font-weight:700">{{reps}}</div>
        <div style="font-size:8.5px;color:{{gray}};font-weight:700;margin-top:3px;text-transform:uppercase">{{repsLabel}}</div>
      </div>
      <div style="flex:1;text-align:center">
        <div style="font-family:{{displayFont}};font-size:15px;font-weight:700">{{rest}}</div>
        <div style="font-size:8.5px;color:{{gray}};font-weight:700;margin-top:3px;text-transform:uppercase">{{restLabel}}</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;overflow:hidden">
      <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
        <div style="display:flex;gap:9px;align-items:flex-start">
          <div style="width:20px;height:20px;border-radius:999px;background:{{volt}};color:{{ink}};font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto">{{step.n}}</div>
          <div style="font-size:11.5px;line-height:1.35;padding-top:2px;font-weight:600;color:#EDEDED">{{step.text}}</div>
        </div>
      </sc-for>
    </div>

    <div style="padding-top:11px;border-top:1px solid {{line}};display:flex;gap:9px;align-items:flex-start">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto;margin-top:1px"><path d="M12 8V13" stroke="{{volt}}" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="16.3" r="1" fill="{{volt}}"></circle><circle cx="12" cy="12" r="9" stroke="{{volt}}" stroke-width="1.8"></circle></svg>
      <div style="font-size:11px;line-height:1.35;color:#D8D8D8;font-weight:600">{{whyText}}</div>
    </div>

    <a href="Timer.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:14px 0;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;margin-top:2px;font-family:{{displayFont}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="{{accentText}}" stroke-width="1.8"></circle><path d="M12 9V13L15 15" stroke="{{accentText}}" stroke-width="1.8" stroke-linecap="round"></path><path d="M9 3H15" stroke="{{accentText}}" stroke-width="1.8" stroke-linecap="round"></path></svg>
      {{startTimerBtn}}
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const mannequinYellow = '#FFD400';
    const line = 'rgba(255,255,255,0.1)';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0E0E0E' };

    const pips = [0, 1, 2, 3, 4].map(i => ({ color: i < 2 ? volt : 'rgba(255,255,255,0.16)' }));

    const stepsRu = [
      { n: 1, text: 'Встань на одну ногу, мяч держи двумя руками перед собой.' },
      { n: 2, text: 'Прыгай вбок, как фигурист на льду, мягко приземляйся на одну ногу.' },
      { n: 3, text: 'Сделай 10 прыжков, затем смени ногу.' }
    ];
    const stepsEn = [
      { n: 1, text: 'Stand on one leg, holding the ball with both hands in front of you.' },
      { n: 2, text: 'Hop sideways like a speed skater, landing softly on one leg.' },
      { n: 3, text: 'Do 10 hops, then switch legs.' }
    ];

    return {
      isChild, ink, surface, gray, volt, mannequinYellow, line,
      heroGlow: `radial-gradient(circle at 50% 42%, rgba(215,254,59,0.16) 0%, rgba(0,0,0,0) 62%), ${ink}`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      back: isRu ? 'Назад' : 'Back',
      category: isRu ? 'Баланс и координация' : 'Balance & Coordination',
      demoLabel: isRu ? 'демо' : 'demo',
      captionsLabel: isRu ? 'Субтитры и голосовые подсказки доступны' : 'Captions and voice cues available',
      title: isRu ? 'Прыжки фигуриста' : 'Skating Jumps',
      levelLabel: isRu ? 'Уровень 2 из 5' : 'Level 2 of 5',
      pips,
      tag1: isRu ? 'Баланс' : 'Balance',
      tag2: isRu ? 'Ноги' : 'Legs',
      sets: '2', setsLabel: isRu ? 'подхода' : 'sets',
      reps: isRu ? '10 на ногу' : '10/leg', repsLabel: isRu ? 'повторы' : 'reps',
      rest: isRu ? '20 сек' : '20 sec', restLabel: isRu ? 'отдых' : 'rest',
      steps: isRu ? stepsRu : stepsEn,
      whyText: isRu
        ? 'Укрепляет голеностоп и бёдра, учит мягко приземляться — снижает риск травм колена и связок.'
        : 'Strengthens the ankle and hips and teaches a soft landing — lowers the risk of knee and ligament injuries.',
      startTimerBtn: isRu ? 'Начать таймер' : 'Start Timer'
    };
  }
}
</script>
</body>
</html>
