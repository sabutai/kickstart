<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — дата начала</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{stripeTexture}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <svg width="390" height="320" viewBox="0 0 390 320" style="position:absolute;top:0;left:0;opacity:0.12;pointer-events:none">
    <circle cx="195" cy="30" r="90" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
    <line x1="0" y1="30" x2="390" y2="30" stroke="#FFFFFF" stroke-width="2"></line>
  </svg>

  <div style="display:flex;align-items:center;gap:12px;padding:24px 20px 0 20px;position:relative;z-index:2">
    <a href="Onboarding2.dc.html" aria-label="{{back}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center;flex:0 0 auto">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6L8 12L15 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="flex:1;display:flex;gap:6px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
        <span style="flex:1;height:4px;border-radius:999px;background:{{st.color}}"></span>
      </sc-for>
    </div>
    <a href="Onboarding4.dc.html" style="font-size:11px;font-weight:700;color:{{gray}};text-transform:uppercase;letter-spacing:0.3px;flex:0 0 auto;white-space:nowrap">{{skip}}</a>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 24px;position:relative;z-index:2;overflow:hidden">

    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="font-family:{{displayFont}};font-size:27px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:0.4px">{{headline}}</div>
      <div style="font-size:13px;color:{{gray}};font-weight:600;line-height:1.4">{{subcopy}}</div>
    </div>

    <div style="display:flex;gap:8px">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
        <div style="flex:1;text-align:center;padding:10px 4px;border-radius:999px;background:{{p.bg}};color:{{p.color}};font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.2px">{{p.label}}</div>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid {{line}}">
      <div style="text-align:center;font-size:12px;font-weight:700;color:{{gray}};text-transform:uppercase;letter-spacing:0.3px;padding-top:10px">{{monthLabel}}</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
        <sc-for list="{{weekdayLabels}}" as="wd" hint-placeholder-count="7">
          <div style="text-align:center;font-size:9px;font-weight:800;color:{{gray}}">{{wd}}</div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center">
            <div style="width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:{{d.bg}};color:{{d.color}}">{{d.num}}</div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="padding:16px 24px 28px 24px;position:relative;z-index:2">
    <a href="Onboarding4.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:15px 0;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;font-family:{{displayFont}}">
      {{nextBtn}}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="{{accentText}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const inkDeep = '#071C11';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const line = 'rgba(255,255,255,0.14)';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const steps = [volt, volt, volt, line].map(color => ({ color }));

    const presetLabelsRu = ['Сегодня', 'Завтра', 'Через неделю'];
    const presetLabelsEn = ['Today', 'Tomorrow', 'In a week'];
    const presetLabels = isRu ? presetLabelsRu : presetLabelsEn;
    const presets = presetLabels.map((label, i) => ({
      label,
      bg: i === 0 ? volt : surface,
      color: i === 0 ? ink : '#FFFFFF'
    }));

    // Oct 2026, Mon-first week; Oct 1 2026 = Thursday. Selected: today (idx 11 -> Oct 9).
    const cells = [
      [28, true], [29, true], [30, true], [1, false], [2, false], [3, false], [4, false],
      [5, false], [6, false], [7, false], [8, false], [9, false], [10, false], [11, false],
      [12, false], [13, false], [14, false], [15, false], [16, false], [17, false], [18, false],
      [19, false], [20, false], [21, false], [22, false], [23, false], [24, false], [25, false],
      [26, false], [27, false], [28, false], [29, false], [30, false], [31, false], [1, true]
    ];
    const selectedIdx = 11;
    const days = cells.map(([num, otherMonth], i) => {
      const selected = i === selectedIdx;
      return {
        num,
        bg: selected ? theme.accent : 'transparent',
        color: selected ? theme.accentText : (otherMonth ? 'rgba(255,255,255,0.3)' : '#FFFFFF')
      };
    });

    const weekdayLabelsRu = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const weekdayLabelsEn = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];

    return {
      ink, surface, gray, volt, line,
      stripeTexture: `repeating-linear-gradient(135deg, ${ink} 0px 46px, ${inkDeep} 46px 92px)`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      steps,
      back: isRu ? 'Назад' : 'Back',
      skip: isRu ? 'Пропустить' : 'Skip',
      headline: isRu ? 'Когда начнём?' : 'When do we start?',
      subcopy: isRu ? 'Можно начать прямо сегодня — или выбрать день позже' : 'You can start right away — or pick a later day',
      presets,
      monthLabel: isRu ? 'Октябрь 2026' : 'October 2026',
      weekdayLabels: isRu ? weekdayLabelsRu : weekdayLabelsEn,
      days,
      nextBtn: isRu ? 'Далее' : 'Next'
    };
  }
}
</script>
</body>
</html>
