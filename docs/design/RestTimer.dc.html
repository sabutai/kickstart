<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таймер отдыха</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{stripeTexture}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <svg width="390" height="320" viewBox="0 0 390 320" style="position:absolute;top:0;left:0;opacity:0.12;pointer-events:none">
    <circle cx="195" cy="30" r="90" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
    <line x1="0" y1="30" x2="390" y2="30" stroke="#FFFFFF" stroke-width="2"></line>
  </svg>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:24px 20px 4px 20px;position:relative;z-index:2">
    <div style="font-size:10.5px;font-weight:800;background:{{surface}};border-radius:999px;padding:6px 13px;text-transform:uppercase;letter-spacing:0.4px;color:{{gray}}">{{category}}</div>
    <div style="display:flex;align-items:center;gap:8px">
      <a href="RestTimerLandscape.dc.html" aria-label="{{rotateToLandscape}}" style="width:32px;height:32px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="7" y="2" width="10" height="20" rx="2.5" stroke="#FFFFFF" stroke-width="1.8"></rect><path d="M3 19L1 16.5L3 14" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <a href="ExerciseDetail.dc.html" aria-label="{{close}}" style="width:32px;height:32px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>
      </a>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 20px;position:relative;z-index:2">
    <div style="font-size:12px;font-weight:800;color:{{volt}};text-transform:uppercase;letter-spacing:2px">{{restLabel}}</div>
    <div style="position:relative;width:236px;height:236px;display:flex;align-items:center;justify-content:center">
      <svg width="236" height="236" viewBox="0 0 236 236" style="position:absolute;inset:0">
        <circle cx="118" cy="118" r="104" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="11"></circle>
        <circle cx="118" cy="118" r="104" fill="none" stroke="{{volt}}" stroke-width="11" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="245" transform="rotate(-90 118 118)"></circle>
      </svg>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-family:{{displayFont}};font-size:48px;font-weight:700;line-height:1">{{timeLabel}}</div>
        <div style="font-size:10.5px;font-weight:700;color:{{gray}};text-transform:uppercase;letter-spacing:0.4px">{{setLabel}}</div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;padding:16px 20px 0 20px;border-top:1px solid {{line}};position:relative;z-index:2">
    <div style="font-size:10.5px;font-weight:800;color:{{gray}};text-transform:uppercase;letter-spacing:0.5px">{{nextLabel}}</div>
    <a href="Timer.dc.html" aria-label="{{nextExerciseName}}" style="display:flex;align-items:center;gap:13px">
      <div style="position:relative;width:72px;height:72px;flex:0 0 auto;border-radius:14px;background:{{catGlow}};display:flex;align-items:center;justify-content:center;overflow:hidden">
        <svg viewBox="0 0 100 100" width="42" height="42" fill="none">
          <path d="M52 27 L49 56 M49 34 L33 42 M49 34 L66 45 M49 56 L36 80 M49 56 L62 82" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M52 27 L49 56 M49 34 L33 42 M49 34 L66 45 M49 56 L36 80 M49 56 L62 82" stroke="{{mannequinYellow}}" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="52" cy="18" r="9.5" fill="{{mannequinYellow}}" stroke="#000000" stroke-width="3.5"></circle>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;flex:1">
        <div style="font-family:{{displayFont}};font-weight:700;font-size:15.5px;text-transform:uppercase;letter-spacing:0.3px">{{nextExerciseName}}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="display:flex;gap:3px">
            <sc-for list="{{nextPips}}" as="p" hint-placeholder-count="5">
              <span style="width:12px;height:4px;border-radius:2px;background:{{p.color}}"></span>
            </sc-for>
          </div>
          <span style="font-size:10px;font-weight:700;color:{{gray}};text-transform:uppercase">{{nextMeta}}</span>
        </div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto"><path d="M9 6L16 12L9 18" stroke="{{gray}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </div>

  <div style="padding:16px 20px 14px 20px;position:relative;z-index:2">
    <a href="Timer.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:14px 0;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;font-family:{{displayFont}}">
      {{skipBtn}}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 5L16 12L6 19Z" fill="{{accentText}}"></path><rect x="17" y="5" width="2.6" height="14" fill="{{accentText}}"></rect></svg>
    </a>
  </div>

  <div style="text-align:center;padding-bottom:16px;position:relative;z-index:2">
    <a href="Main.dc.html" style="font-size:12px;font-weight:700;color:{{gray}};text-decoration:underline;text-transform:uppercase;letter-spacing:0.3px">{{endBtn}}</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const inkDeep = '#071C11';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const mannequinYellow = '#FFD400';
    const line = 'rgba(255,255,255,0.1)';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const nextPips = [0, 1, 2, 3, 4].map(i => ({ color: i < 2 ? volt : 'rgba(255,255,255,0.16)' }));

    return {
      ink, surface, gray, volt, mannequinYellow, line,
      stripeTexture: `repeating-linear-gradient(135deg, ${ink} 0px 46px, ${inkDeep} 46px 92px)`,
      catGlow: `radial-gradient(circle at 50% 45%, rgba(57,224,117,0.3) 0%, rgba(11,42,27,0) 70%), ${ink}`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      category: isRu ? 'Баланс и координация' : 'Balance & Coordination',
      close: isRu ? 'Закрыть' : 'Close',
      rotateToLandscape: isRu ? 'Повернуть в альбомный режим' : 'Rotate to landscape',
      restLabel: isRu ? 'Отдых' : 'Rest',
      timeLabel: '00:20',
      setLabel: isRu ? 'Перед подходом 3 из 3' : 'Before set 3 of 3',
      nextLabel: isRu ? 'Следующее упражнение' : 'Next exercise',
      nextExerciseName: isRu ? 'Слалом с мячом' : 'Ball Slalom',
      nextPips,
      nextMeta: isRu ? 'Ур. 2 · 4 мин' : 'Lvl 2 · 4 min',
      skipBtn: isRu ? 'Пропустить отдых' : 'Skip rest',
      endBtn: isRu ? 'Завершить тренировку' : 'End session'
    };
  }
}
</script>
</body>
</html>
