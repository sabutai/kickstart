<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таймер отдыха — альбомный режим</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
</style>
</helmet>

<div style="width:844px;height:390px;background:{{ink}};font-family:{{bodyFont}};overflow:hidden;position:relative;color:#FFFFFF">

  <div style="position:absolute;left:0;top:0;width:456px;height:100%;background:{{catGlow}};display:flex;align-items:center;justify-content:center">
    <svg viewBox="0 0 100 100" width="150" height="150" fill="none" style="opacity:0.9">
      <path d="M52 27 L49 56 M49 34 L33 42 M49 34 L66 45 M49 56 L36 80 M49 56 L62 82" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M52 27 L49 56 M49 34 L33 42 M49 34 L66 45 M49 56 L36 80 M49 56 L62 82" stroke="{{mannequinYellow}}" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="52" cy="18" r="9.5" fill="{{mannequinYellow}}" stroke="#000000" stroke-width="3.5"></circle>
    </svg>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(11,42,27,0) 0%, rgba(11,42,27,0) 46%, {{ink}} 60%, {{ink}} 100%)"></div>

  <div style="position:absolute;left:26px;bottom:20px;display:flex;flex-direction:column;gap:6px;max-width:300px">
    <div style="font-size:10px;font-weight:800;color:{{volt}};text-transform:uppercase;letter-spacing:0.5px;text-shadow:0 1px 6px rgba(0,0,0,0.6)">{{nextLabel}}</div>
    <div style="font-family:{{displayFont}};font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:0.3px;text-shadow:0 2px 10px rgba(0,0,0,0.6)">{{nextExerciseName}}</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="display:flex;gap:3px">
        <sc-for list="{{nextPips}}" as="p" hint-placeholder-count="5">
          <span style="width:12px;height:4px;border-radius:2px;background:{{p.color}}"></span>
        </sc-for>
      </div>
      <span style="font-size:10.5px;font-weight:700;color:{{gray}};text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,0.6)">{{nextMeta}}</span>
    </div>
  </div>

  <div style="position:relative;z-index:1;display:flex;height:100%">
    <div style="flex:1"></div>

    <div style="flex:0 0 388px;display:flex;flex-direction:column;justify-content:space-between;padding:18px 26px 20px 20px;height:100%">

      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:10px;font-weight:800;background:{{surface}};border-radius:999px;padding:5px 12px;text-transform:uppercase;letter-spacing:0.4px;color:{{gray}}">{{category}}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <a href="RestTimer.dc.html" aria-label="{{rotateToPortrait}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="20" height="10" rx="2.5" stroke="#FFFFFF" stroke-width="1.8"></rect><path d="M19 3L22 5.5L19 8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <a href="ExerciseDetail.dc.html" aria-label="{{close}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>
          </a>
        </div>
      </div>

      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;width:176px;height:176px;display:flex;align-items:center;justify-content:center">
          <svg width="176" height="176" viewBox="0 0 176 176" style="position:absolute;inset:0">
            <circle cx="88" cy="88" r="78" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="10"></circle>
            <circle cx="88" cy="88" r="78" fill="none" stroke="{{volt}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="184" transform="rotate(-90 88 88)"></circle>
          </svg>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
            <div style="font-size:10.5px;font-weight:800;color:{{volt}};text-transform:uppercase;letter-spacing:1.6px">{{restLabel}}</div>
            <div style="font-family:{{displayFont}};font-size:34px;font-weight:700;line-height:1">{{timeLabel}}</div>
          </div>
        </div>
      </div>

      <a href="Timer.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:12px 0;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;font-family:{{displayFont}}">
        {{skipBtn}}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 5L16 12L6 19Z" fill="{{accentText}}"></path><rect x="17" y="5" width="2.6" height="14" fill="{{accentText}}"></rect></svg>
      </a>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const mannequinYellow = '#FFD400';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const nextPips = [0, 1, 2, 3, 4].map(i => ({ color: i < 2 ? volt : 'rgba(255,255,255,0.16)' }));

    return {
      ink, surface, gray, volt, mannequinYellow,
      catGlow: `radial-gradient(circle at 50% 45%, rgba(57,224,117,0.3) 0%, rgba(11,42,27,0) 70%), ${ink}`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      category: isRu ? 'Баланс и координация' : 'Balance & Coordination',
      close: isRu ? 'Закрыть' : 'Close',
      rotateToPortrait: isRu ? 'Повернуть в портретный режим' : 'Rotate to portrait',
      restLabel: isRu ? 'Отдых' : 'Rest',
      timeLabel: '00:20',
      nextLabel: isRu ? 'Следующее упражнение' : 'Next exercise',
      nextExerciseName: isRu ? 'Слалом с мячом' : 'Ball Slalom',
      nextPips,
      nextMeta: isRu ? 'Ур. 2 · 4 мин' : 'Lvl 2 · 4 min',
      skipBtn: isRu ? 'Пропустить отдых' : 'Skip rest'
    };
  }
}
</script>
</body>
</html>
