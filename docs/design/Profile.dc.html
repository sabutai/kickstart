<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профиль и прогресс</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
.statRow>div+div{border-left:1px solid rgba(255,255,255,0.1)}
.covRow+.covRow{border-top:1px solid rgba(255,255,255,0.08)}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{stripeTexture}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <div style="position:relative;height:196px;flex:0 0 auto;overflow:hidden">
    <svg width="390" height="196" viewBox="0 0 390 196" style="position:absolute;top:0;left:0;opacity:0.14;pointer-events:none">
      <circle cx="80" cy="30" r="90" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
      <line x1="0" y1="30" x2="390" y2="30" stroke="#FFFFFF" stroke-width="2"></line>
    </svg>
    <div style="position:absolute;right:-28px;top:6px;opacity:0.9">
      <svg viewBox="0 0 100 120" width="150" height="180" fill="none">
        <path d="M48 28 L51 58 M51 34 L30 24 M51 34 L70 42 M51 58 L47 96 L43 104 M51 58 L68 70 L74 54" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M48 28 L51 58 M51 34 L30 24 M51 34 L70 42 M51 58 L47 96 L43 104 M51 58 L68 70 L74 54" stroke="{{mannequinYellow}}" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="48" cy="18" r="11" fill="{{mannequinYellow}}" stroke="#000000" stroke-width="4"></circle>
      </svg>
    </div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, {{ink}} 100%)"></div>

    <div style="position:absolute;top:22px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:{{displayFont}};font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:{{gray}}">{{headerTitle}}</div>
      <button aria-label="{{settingsLabel}}" style="width:32px;height:32px;border-radius:999px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#FFFFFF" stroke-width="1.8"></circle><path d="M12 3V5M12 19V21M3 12H5M19 12H21M5.6 5.6L7 7M17 17L18.4 18.4M18.4 5.6L17 7M7 17L5.6 18.4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path></svg>
      </button>
    </div>

    <div style="position:absolute;left:20px;bottom:16px;display:flex;align-items:center;gap:14px">
      <div style="width:64px;height:64px;border-radius:999px;background:{{accent}};display:flex;align-items:center;justify-content:center;font-family:{{displayFont}};font-size:24px;font-weight:700;color:{{accentText}};flex:0 0 auto;border:3px solid {{ink}}">{{initials}}</div>
      <div>
        <div style="font-family:{{displayFont}};font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px">{{name}}</div>
        <div style="font-size:11.5px;color:{{gray}};margin-top:3px;font-weight:600">{{roleLine}}</div>
      </div>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 20px 12px 20px;overflow:hidden">

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:11px;font-weight:800;color:{{gray}};text-transform:uppercase;letter-spacing:0.5px">{{levelLabel}}</span>
        <span style="font-size:11px;font-weight:700;color:{{volt}}">{{levelPct}}</span>
      </div>
      <div style="height:6px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden">
        <div style="height:100%;width:{{levelPct}};border-radius:999px;background:{{volt}}"></div>
      </div>
      <div style="display:flex;gap:3px">
        <sc-for list="{{pips}}" as="p" hint-placeholder-count="5">
          <span style="flex:1;height:5px;border-radius:2px;background:{{p.color}}"></span>
        </sc-for>
      </div>
      <div style="font-size:11px;color:{{gray}};font-weight:600">{{nextLevelText}}</div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid {{line}}">
      <span style="font-size:20px">🏅</span>
      <div style="font-size:12.5px;font-weight:700;line-height:1.3">{{milestoneText}}</div>
    </div>

    <div class="statRow" style="display:flex;padding-top:12px;border-top:1px solid {{line}}">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="flex:1;text-align:center">
          <div style="font-family:{{displayFont}};font-size:19px;font-weight:700">{{s.value}}</div>
          <div style="font-size:9px;color:{{gray}};font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:0.2px">{{s.label}}</div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isChild}}">
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid {{line}};overflow:hidden">
        <div style="font-size:11px;font-weight:800;color:{{gray}};text-transform:uppercase;letter-spacing:0.5px">{{badgesTitle}}</div>
        <div style="display:flex;gap:14px;overflow-x:auto">
          <sc-for list="{{badges}}" as="b" hint-placeholder-count="4">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:58px;flex:0 0 auto">
              <sc-if value="{{b.locked}}" hint-placeholder-val="{{false}}">
                <div style="width:46px;height:46px;border-radius:999px;background:transparent;border:2px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="{{grayDim}}" stroke-width="1.8"></rect><path d="M8 11V8A4 4 0 0 1 16 8V11" stroke="{{grayDim}}" stroke-width="1.8"></path></svg>
                </div>
              </sc-if>
              <sc-if value="{{!b.locked}}" hint-placeholder-val="{{true}}">
                <div style="width:46px;height:46px;border-radius:999px;background:{{volt}};display:flex;align-items:center;justify-content:center">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3L15 9L21 10L16.5 14.5L17.7 21L12 17.8L6.3 21L7.5 14.5L3 10L9 9Z" fill="{{ink}}"></path></svg>
                </div>
              </sc-if>
              <span style="font-size:9.5px;font-weight:700;color:{{gray}};text-align:center;line-height:1.2;text-transform:uppercase">{{b.label}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{!isChild}}">
      <div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid {{line}};overflow:hidden">
        <div style="font-size:11px;font-weight:800;color:{{gray}};text-transform:uppercase;letter-spacing:0.5px">{{coverageTitle}}</div>
        <sc-for list="{{coverage}}" as="c" hint-placeholder-count="5">
          <div class="covRow" style="display:flex;flex-direction:column;gap:5px;padding:8px 0">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div style="display:flex;align-items:center;gap:7px">
                <span style="width:8px;height:8px;border-radius:999px;background:{{c.color}}"></span>
                <span style="font-size:11.5px;font-weight:700">{{c.label}}</span>
              </div>
              <span style="font-size:11px;font-weight:700;color:{{gray}}">{{c.pct}}</span>
            </div>
            <div style="height:5px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden">
              <div style="height:100%;width:{{c.pct}};border-radius:999px;background:{{c.color}}"></div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <div style="display:flex;align-items:stretch;justify-content:space-around;background:{{ink}};border-top:1px solid {{line}};padding:9px 6px 14px 6px">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 11px;color:{{gray}}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V19A1 1 0 0 1 19 20H14V14H10V20H5A1 1 0 0 1 4 19Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
      <span style="font-size:9px;font-weight:600;text-transform:uppercase">{{nav.home}}</span>
    </a>
    <a href="Library.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 11px;color:{{gray}}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 4H12V20H5A1 1 0 0 1 4 19V5A1 1 0 0 1 5 4Z" stroke="currentColor" stroke-width="1.8"></path><path d="M12 4H19A1 1 0 0 1 20 5V19A1 1 0 0 1 19 20H12" stroke="currentColor" stroke-width="1.8"></path></svg>
      <span style="font-size:9px;font-weight:600;text-transform:uppercase">{{nav.library}}</span>
    </a>
    <a href="Timer.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 11px;color:{{gray}}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 9V13L15 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><path d="M9 3H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <span style="font-size:9px;font-weight:600;text-transform:uppercase">{{nav.timer}}</span>
    </a>
    <a href="Calendar.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 11px;color:{{gray}}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8"></rect><path d="M8 3V7M16 3V7M4 10H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <span style="font-size:9px;font-weight:600;text-transform:uppercase">{{nav.calendar}}</span>
    </a>
    <a href="Profile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 11px;color:{{volt}}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"></circle><path d="M4 20C4 16 7.5 14 12 14C16.5 14 20 16 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      <span style="font-size:9px;font-weight:700;text-transform:uppercase">{{nav.profile}}</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const inkDeep = '#071C11';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const grayDim = '#6E8B78';
    const volt = '#D7FE3B';
    const mannequinYellow = '#FFD400';
    const line = 'rgba(255,255,255,0.1)';
    const stripeTexture = `repeating-linear-gradient(135deg, ${ink} 0px 46px, ${inkDeep} 46px 92px)`;

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const pips = [0, 1, 2, 3, 4].map(i => ({ color: i < 2 ? volt : 'rgba(255,255,255,0.16)' }));

    const catColors = ['#39E075', '#4D8CFF', '#FF7A3D', '#C79BFF', '#F2C230'];
    const covRu = ['Разминка', 'Баланс', 'Сила', 'Техника', 'Игры'];
    const covEn = ['Warm-up', 'Balance', 'Strength', 'Technique', 'Games'];
    const covPct = [90, 70, 55, 65, 40];
    const coverage = (isRu ? covRu : covEn).map((label, i) => ({ label, color: catColors[i], pct: covPct[i] + '%' }));

    const badgesRu = [
      { label: 'Баланс', locked: false },
      { label: 'Силач', locked: false },
      { label: 'Техник', locked: false },
      { label: 'Капитан', locked: true }
    ];
    const badgesEn = [
      { label: 'Balance', locked: false },
      { label: 'Strength', locked: false },
      { label: 'Technician', locked: false },
      { label: 'Captain', locked: true }
    ];

    const statsRu = [
      { label: 'Тренировок', value: '24' },
      { label: 'Минут', value: '360' },
      { label: 'Серия', value: '12 дн.' }
    ];
    const statsEn = [
      { label: 'Sessions', value: '24' },
      { label: 'Minutes', value: '360' },
      { label: 'Streak', value: '12 d.' }
    ];

    return {
      isChild,
      ink, surface, gray, grayDim, volt, mannequinYellow, line, stripeTexture,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      headerTitle: isRu ? 'Профиль' : 'Profile',
      settingsLabel: isRu ? 'Настройки' : 'Settings',
      initials: 'ТБ',
      name: isRu ? 'Тимур Байкалов' : 'Timur Baikalov',
      roleLine: isRu ? (isChild ? 'Уровень 2 · 8 лет' : 'Тренер · Группа 8 лет') : (isChild ? 'Level 2 · Age 8' : 'Coach · Age 8 group'),
      levelLabel: isRu ? 'Уровень 2 из 5' : 'Level 2 of 5',
      levelPct: '42%',
      pips,
      nextLevelText: isRu ? 'Ещё 6 тренировок до уровня 3' : '6 more sessions to level 3',
      milestoneText: isRu ? 'Личный рекорд: 5 тренировок подряд — продолжай в том же духе!' : 'Personal record: 5 sessions in a row — keep it up!',
      stats: isRu ? statsRu : statsEn,
      badgesTitle: isRu ? 'Твои значки' : 'Your badges',
      badges: isRu ? badgesRu : badgesEn,
      coverageTitle: isRu ? 'Покрытие категорий' : 'Category coverage',
      coverage,
      nav: {
        home: isRu ? 'Главная' : 'Home',
        library: isRu ? 'Упражнения' : 'Exercises',
        timer: isRu ? 'Таймер' : 'Timer',
        calendar: isRu ? 'Календарь' : 'Calendar',
        profile: isRu ? 'Профиль' : 'Profile'
      }
    };
  }
}
</script>
</body>
</html>
