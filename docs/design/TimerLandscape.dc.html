<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Таймер тренировки — альбомный режим</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
</style>
</helmet>

<div style="width:844px;height:390px;background:{{ink}};font-family:{{bodyFont}};overflow:hidden;position:relative;color:#FFFFFF">

  <svg viewBox="0 0 100 130" width="300" height="390" fill="none" style="position:absolute;left:30px;top:0;z-index:0">
    <path d="M22 70 L38 62 M24 80 L40 76 M26 90 L41 88" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.14"></path>
    <path d="M50 30 L53 62 M53 36 L31 25 M53 36 L74 45 M53 62 L49 102 L45 111 M53 62 L72 76 L79 58" stroke="#000000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M50 30 L53 62 M53 36 L31 25 M53 36 L74 45 M53 62 L49 102 L45 111 M53 62 L72 76 L79 58" stroke="{{mannequinYellow}}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="50" cy="19" r="12" fill="{{mannequinYellow}}" stroke="#000000" stroke-width="4.5"></circle>
    <path d="M78 52 L94 46 M80 60 L96 56 M82 68 L96 66" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.14"></path>
  </svg>

  <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(11,42,27,0) 0%, rgba(11,42,27,0) 48%, {{ink}} 64%, {{ink}} 100%)"></div>

  <div style="position:relative;z-index:1;display:flex;height:100%">

    <div style="flex:1"></div>

    <div style="flex:0 0 388px;display:flex;flex-direction:column;justify-content:space-between;padding:18px 26px 20px 20px;height:100%">

      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:10px;font-weight:800;background:{{surface}};border-radius:999px;padding:5px 12px;text-transform:uppercase;letter-spacing:0.4px;color:{{gray}}">{{category}}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <a href="Timer.dc.html" aria-label="{{rotateToPortrait}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="20" height="10" rx="2.5" stroke="#FFFFFF" stroke-width="1.8"></rect><path d="M19 3L22 5.5L19 8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <a href="ExerciseDetail.dc.html" aria-label="{{close}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>
          </a>
        </div>
      </div>

      <div>
        <div style="font-family:{{displayFont}};font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;text-shadow:0 2px 10px rgba(0,0,0,0.6)">{{exerciseName}}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <div style="display:flex;gap:7px">
            <sc-for list="{{sets}}" as="s" hint-placeholder-count="3">
              <span style="width:{{s.size}};height:5px;border-radius:999px;background:{{s.color}}"></span>
            </sc-for>
          </div>
          <span style="font-size:10.5px;font-weight:700;color:{{gray}};text-transform:uppercase;letter-spacing:0.4px;text-shadow:0 1px 6px rgba(0,0,0,0.6)">{{setLabel}}</span>
        </div>
      </div>

      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;width:176px;height:176px;display:flex;align-items:center;justify-content:center">
          <svg width="176" height="176" viewBox="0 0 176 176" style="position:absolute;inset:0">
            <circle cx="88" cy="88" r="78" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="10"></circle>
            <circle cx="88" cy="88" r="78" fill="none" stroke="{{volt}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="121" transform="rotate(-90 88 88)"></circle>
          </svg>
          <div style="font-family:{{displayFont}};font-size:40px;font-weight:700;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,0.75)">{{timeLabel}}</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:center;gap:22px">
          <button aria-label="{{replay}}" style="width:38px;height:38px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12A8 8 0 0 1 19 8.5M20 12A8 8 0 0 1 5 15.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path><path d="M16 5L19 8.5L15.5 9.5M8 19L5 15.5L8.5 14.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <button aria-label="{{pause}}" style="width:60px;height:60px;border-radius:999px;background:{{volt}};display:flex;align-items:center;justify-content:center">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="{{ink}}"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg>
          </button>
          <button aria-label="{{skip}}" style="width:38px;height:38px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 5L16 12L6 19Z" fill="#FFFFFF"></path><rect x="17" y="5" width="2.6" height="14" fill="#FFFFFF"></rect></svg>
          </button>
        </div>
        <a href="RestTimerLandscape.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px" aria-label="{{upNextLabel}} {{upNextValue}}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="{{volt}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="font-size:11px;text-shadow:0 1px 6px rgba(0,0,0,0.6)"><span style="color:{{gray}};font-weight:600">{{upNextLabel}} </span><span style="font-weight:700">{{upNextValue}}</span></div>
        </a>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const mannequinYellow = '#FFD400';

    const sets = [
      { size: '30px', color: volt },
      { size: '30px', color: volt },
      { size: '30px', color: 'rgba(255,255,255,0.14)' }
    ];

    return {
      ink, surface, gray, volt, mannequinYellow,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      category: isRu ? 'Баланс и координация' : 'Balance & Coordination',
      close: isRu ? 'Закрыть' : 'Close',
      rotateToPortrait: isRu ? 'Повернуть в портретный режим' : 'Rotate to portrait',
      exerciseName: isRu ? 'Прыжки фигуриста' : 'Skating Jumps',
      sets,
      setLabel: isRu ? 'Подход 2 из 3' : 'Set 2 of 3',
      timeLabel: '00:20',
      replay: isRu ? 'Повторить демонстрацию' : 'Replay demo',
      pause: isRu ? 'Пауза' : 'Pause',
      skip: isRu ? 'Дальше' : 'Skip',
      upNextLabel: isRu ? 'Далее:' : 'Up next:',
      upNextValue: isRu ? 'Отдых 20 сек' : 'Rest 20 sec'
    };
  }
}
</script>
</body>
</html>
