<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — имя и возраст</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{stripeTexture}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <svg width="390" height="320" viewBox="0 0 390 320" style="position:absolute;top:0;left:0;opacity:0.12;pointer-events:none">
    <circle cx="195" cy="30" r="90" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
    <line x1="0" y1="30" x2="390" y2="30" stroke="#FFFFFF" stroke-width="2"></line>
  </svg>

  <div style="display:flex;align-items:center;gap:12px;padding:24px 20px 0 20px;position:relative;z-index:2">
    <div style="width:30px;height:30px;flex:0 0 auto"></div>
    <div style="flex:1;display:flex;gap:6px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
        <span style="flex:1;height:4px;border-radius:999px;background:{{st.color}}"></span>
      </sc-for>
    </div>
    <div style="width:30px;height:30px;flex:0 0 auto"></div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;padding:0 24px;position:relative;z-index:2;overflow:hidden">

    <div style="display:flex;align-items:center;gap:8px">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="12" stroke="#FFFFFF" stroke-width="2.2"></circle>
        <path d="M14 7L18 10L16.5 15H11.5L10 10Z" fill="#FFFFFF"></path>
      </svg>
      <div style="font-family:{{displayFont}};font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:{{gray}}">{{appName}}</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="font-family:{{displayFont}};font-size:28px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:0.4px">{{headline}}</div>
      <div style="font-size:13px;color:{{gray}};font-weight:600;line-height:1.4">{{subcopy}}</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <label style="font-size:11px;font-weight:800;color:{{gray}};text-transform:uppercase;letter-spacing:0.5px">{{nameLabel}}</label>
      <input type="text" value="{{nameValue}}" placeholder="{{namePlaceholder}}" style="border:none;border-bottom:2px solid {{line}};background:transparent;color:#FFFFFF;font-size:19px;font-weight:600;font-family:{{displayFont}};text-transform:uppercase;letter-spacing:0.3px;padding:6px 0;outline:none;width:100%">
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <label style="font-size:11px;font-weight:800;color:{{gray}};text-transform:uppercase;letter-spacing:0.5px">{{ageLabel}}</label>
      <div style="display:flex;align-items:center;justify-content:center;gap:26px">
        <button aria-label="{{ageMinus}}" style="width:42px;height:42px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12H19" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
        </button>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span style="font-family:{{displayFont}};font-size:42px;font-weight:700">{{age}}</span>
          <span style="font-size:12px;font-weight:700;color:{{gray}};text-transform:uppercase">{{ageUnit}}</span>
        </div>
        <button aria-label="{{agePlus}}" style="width:42px;height:42px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
        </button>
      </div>
    </div>

  </div>

  <div style="padding:16px 24px 28px 24px;position:relative;z-index:2">
    <a href="Onboarding2.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:15px 0;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;font-family:{{displayFont}}">
      {{nextBtn}}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="{{accentText}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const inkDeep = '#071C11';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const line = 'rgba(255,255,255,0.14)';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const steps = [volt, line, line, line].map(color => ({ color }));

    return {
      ink, surface, gray, volt, line,
      stripeTexture: `repeating-linear-gradient(135deg, ${ink} 0px 46px, ${inkDeep} 46px 92px)`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      appName: isRu ? 'КикСтарт' : 'KickStart',
      steps,
      headline: isRu ? 'Познакомимся!' : 'Let’s get acquainted!',
      subcopy: isRu ? 'Это поможет настроить тренировки под юного футболиста' : 'This helps us tailor training to your young footballer',
      nameLabel: isRu ? 'Имя ребёнка' : 'Child’s name',
      nameValue: isRu ? 'Тимур' : 'Timur',
      namePlaceholder: isRu ? 'Введи имя' : 'Enter name',
      ageLabel: isRu ? 'Возраст' : 'Age',
      age: '8',
      ageUnit: isRu ? 'лет' : 'yrs',
      ageMinus: isRu ? 'Уменьшить возраст' : 'Decrease age',
      agePlus: isRu ? 'Увеличить возраст' : 'Increase age',
      nextBtn: isRu ? 'Далее' : 'Next'
    };
  }
}
</script>
</body>
</html>
