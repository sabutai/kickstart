<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — напоминания и PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{stripeTexture}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <svg width="390" height="320" viewBox="0 0 390 320" style="position:absolute;top:0;left:0;opacity:0.12;pointer-events:none">
    <circle cx="195" cy="30" r="90" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
    <line x1="0" y1="30" x2="390" y2="30" stroke="#FFFFFF" stroke-width="2"></line>
  </svg>

  <div style="display:flex;align-items:center;gap:12px;padding:24px 20px 0 20px;position:relative;z-index:2">
    <a href="Onboarding3.dc.html" aria-label="{{back}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center;flex:0 0 auto">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6L8 12L15 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="flex:1;display:flex;gap:6px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
        <span style="flex:1;height:4px;border-radius:999px;background:{{st.color}}"></span>
      </sc-for>
    </div>
    <div style="width:30px;height:30px;flex:0 0 auto"></div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:18px;padding:18px 24px 0 24px;position:relative;z-index:2;overflow:hidden">

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="font-family:{{displayFont}};font-size:25px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:0.4px">{{headline}}</div>
      <div style="font-size:13px;color:{{gray}};font-weight:600;line-height:1.4">{{subcopy}}</div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px">
      <div style="display:flex;flex-direction:column;gap:3px">
        <div style="font-size:13px;font-weight:700">{{remindLabel}}</div>
        <div style="font-size:11px;color:{{gray}};font-weight:600">{{remindTime}}</div>
      </div>
      <div style="width:46px;height:26px;border-radius:999px;background:{{volt}};display:flex;align-items:center;padding:3px;flex:0 0 auto">
        <div style="width:20px;height:20px;border-radius:999px;background:{{ink}};margin-left:auto"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;padding-top:12px;border-top:1px solid {{line}}">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="font-size:13px;font-weight:700">{{pinLabel}}</div>
        <div style="font-size:11px;color:{{gray}};font-weight:600;line-height:1.4">{{pinHint}}</div>
      </div>

      <div style="display:flex;justify-content:center;gap:14px">
        <sc-for list="{{pinDots}}" as="dot" hint-placeholder-count="4">
          <span style="width:13px;height:13px;border-radius:999px;background:{{dot.bg}};border:2px solid {{volt}}"></span>
        </sc-for>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:260px;margin:0 auto">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <div style="display:flex;align-items:center;justify-content:center;padding:9px 0">
            <span style="font-family:{{displayFont}};font-size:19px;font-weight:600">{{k.label}}</span>
          </div>
        </sc-for>
      </div>

      <a href="Main.dc.html" style="text-align:center;font-size:11.5px;font-weight:700;color:{{gray}};text-decoration:underline;text-transform:uppercase;letter-spacing:0.2px">{{setLaterLink}}</a>
    </div>

  </div>

  <div style="padding:16px 24px 26px 24px;position:relative;z-index:2">
    <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:15px 0;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;font-family:{{displayFont}}">
      {{startBtn}}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="{{accentText}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const inkDeep = '#071C11';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const line = 'rgba(255,255,255,0.14)';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const steps = [volt, volt, volt, volt].map(color => ({ color }));

    const pinDots = [0, 1, 2, 3].map(i => ({ bg: i < 2 ? volt : 'transparent' }));

    const keyLabels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
    const keys = keyLabels.map(label => ({ label }));

    return {
      ink, surface, gray, volt, line,
      stripeTexture: `repeating-linear-gradient(135deg, ${ink} 0px 46px, ${inkDeep} 46px 92px)`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      steps,
      back: isRu ? 'Назад' : 'Back',
      headline: isRu ? 'Напоминания и код взрослого' : 'Reminders & grown-up code',
      subcopy: isRu ? 'Последний шаг — и начинаем тренировки' : 'Last step — then let’s start training',
      remindLabel: isRu ? 'Напоминать перед тренировкой' : 'Remind before training',
      remindTime: isRu ? 'В 18:00 в дни тренировок' : 'At 6:00 PM on training days',
      pinLabel: isRu ? 'PIN для взрослых' : 'Adult PIN',
      pinHint: isRu ? '4 цифры, чтобы менять настройки мог только взрослый' : 'A 4-digit code so only a grown-up can change settings',
      pinDots,
      keys,
      setLaterLink: isRu ? 'Настроить позже' : 'Set up later',
      startBtn: isRu ? 'Начать тренировки' : 'Start training'
    };
  }
}
</script>
</body>
</html>
