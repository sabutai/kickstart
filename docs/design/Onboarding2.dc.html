<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — дни тренировок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;background:none;cursor:pointer}
</style>
</helmet>

<div style="width:390px;height:844px;background:{{stripeTexture}};font-family:{{bodyFont}};display:flex;flex-direction:column;overflow:hidden;position:relative;color:#FFFFFF">

  <svg width="390" height="320" viewBox="0 0 390 320" style="position:absolute;top:0;left:0;opacity:0.12;pointer-events:none">
    <circle cx="195" cy="30" r="90" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
    <line x1="0" y1="30" x2="390" y2="30" stroke="#FFFFFF" stroke-width="2"></line>
  </svg>

  <div style="display:flex;align-items:center;gap:12px;padding:24px 20px 0 20px;position:relative;z-index:2">
    <a href="Onboarding1.dc.html" aria-label="{{back}}" style="width:30px;height:30px;border-radius:999px;background:{{surface}};display:flex;align-items:center;justify-content:center;flex:0 0 auto">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6L8 12L15 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="flex:1;display:flex;gap:6px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
        <span style="flex:1;height:4px;border-radius:999px;background:{{st.color}}"></span>
      </sc-for>
    </div>
    <a href="Onboarding3.dc.html" style="font-size:11px;font-weight:700;color:{{gray}};text-transform:uppercase;letter-spacing:0.3px;flex:0 0 auto;white-space:nowrap">{{skip}}</a>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:0 24px;position:relative;z-index:2;overflow:hidden">

    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="font-family:{{displayFont}};font-size:27px;font-weight:700;line-height:1.1;text-transform:uppercase;letter-spacing:0.4px">{{headline}}</div>
      <div style="font-size:13px;color:{{gray}};font-weight:600;line-height:1.4">{{subcopy}}</div>
    </div>

    <div style="display:flex;gap:7px;justify-content:space-between">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;flex:1">
          <button aria-label="{{d.label}}" aria-pressed="{{d.selected}}" style="width:38px;height:38px;border-radius:999px;background:{{d.bg}};border:{{d.border}};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:{{d.color}}">{{d.short}}</button>
        </div>
      </sc-for>
    </div>

    <div style="font-size:11.5px;color:{{gray}};font-weight:600;text-align:center">{{hint}}</div>

  </div>

  <div style="padding:16px 24px 28px 24px;position:relative;z-index:2">
    <a href="Onboarding3.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:{{accent}};color:{{accentText}};border-radius:999px;padding:15px 0;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;font-family:{{displayFont}}">
      {{nextBtn}}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="{{accentText}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","default":"ru","options":["ru","en"],"section":"Язык / Language"},"mode":{"editor":"enum","default":"child","options":["child","coach"],"section":"Режим / Mode"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'ru';
    const mode = this.props.mode ?? 'child';
    const isChild = mode === 'child';
    const isRu = lang === 'ru';

    const ink = '#0B2A1B';
    const inkDeep = '#071C11';
    const surface = '#153B27';
    const gray = '#9FC2AC';
    const volt = '#D7FE3B';
    const line = 'rgba(255,255,255,0.14)';

    const theme = isChild
      ? { accent: '#FF5A1F', accentText: '#FFFFFF' }
      : { accent: '#FFFFFF', accentText: '#0B2A1B' };

    const steps = [volt, volt, line, line].map(color => ({ color }));

    const labelsRu = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const labelsEn = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const shortRu = ['П', 'В', 'С', 'Ч', 'П', 'С', 'В'];
    const shortEn = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const selectedIdx = [1, 3, 5];
    const labels = isRu ? labelsRu : labelsEn;
    const shorts = isRu ? shortRu : shortEn;
    const days = labels.map((label, i) => {
      const selected = selectedIdx.includes(i);
      return {
        label, short: shorts[i], selected,
        bg: selected ? volt : 'transparent',
        color: selected ? ink : '#FFFFFF',
        border: selected ? 'none' : `2px solid ${line}`
      };
    });

    return {
      ink, surface, gray, volt, line,
      stripeTexture: `repeating-linear-gradient(135deg, ${ink} 0px 46px, ${inkDeep} 46px 92px)`,
      accent: theme.accent, accentText: theme.accentText,
      displayFont: "'Oswald', system-ui, sans-serif",
      bodyFont: "'Manrope', system-ui, sans-serif",
      steps,
      back: isRu ? 'Назад' : 'Back',
      skip: isRu ? 'Пропустить' : 'Skip',
      headline: isRu ? 'Когда тренируемся?' : 'When do we train?',
      subcopy: isRu ? 'Выбери дни недели — мы напомним перед тренировкой' : 'Pick the days — we’ll remind you before each session',
      days,
      hint: isRu ? 'Рекомендуем 2–3 раза в неделю' : 'We recommend 2–3 times a week',
      nextBtn: isRu ? 'Далее' : 'Next'
    };
  }
}
</script>
</body>
</html>
